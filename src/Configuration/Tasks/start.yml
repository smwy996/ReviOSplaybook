---
title: 初始化
description: 复制 Revision 文件夹和文件，并完成初始设置
privilege: TrustedInstaller
actions:
  
  - !writeStatus: {status: "正在初始化"}

  # Prevent annoying notifications during deployment
  - !registryValue:
    path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Notifications\Settings\Windows.SystemToast.SecurityAndMaintenance'
    value: 'Enabled'
    type: REG_DWORD
    data: '0'

  - !cmd:
    exeDir: true
    command: 'robocopy "Licenses" "%SystemDrive%\Licenses" /E /PURGE /IM /IT /NP'
    ignoreErrors: true
    weight: 30
    
  - !cmd:
    exeDir: true
    command: 'copy /y "hosts" "%WINDIR%\System32\drivers\etc\hosts"'
    weight: 20

  # Necessary to clean DNS Cache after modifying hosts
  - !cmd:
    command: 'ipconfig /flushdns'

  - !writeStatus: {status: "正在安装 Visual C++ 运行库"}
  - !download: 
    url: 'https://aka.ms/vs/17/release/vc_redist.x64.exe'
    destination: "vc_redist.x64.exe"
    overwrite: true
  - !run:
    exeDir: true
    exe: "vc_redist.x64.exe"
    args: '/quiet /norestart'

  - !writeStatus: {status: '正在安装 Revision 工具'}
  - !download: 
    url: 'https://github.com/meetrevision/revision-tool/releases/latest/download/RevisionTool-Setup.exe'
    destination: "RevisionTool-Setup-Latest.exe"
    overwrite: true
    errorAction: Log
  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Halt
    weight: 50
    command: >-
      $installer = if (Test-Path -LiteralPath '.\RevisionTool-Setup-Latest.exe') {
        '.\RevisionTool-Setup-Latest.exe'
      } elseif (Test-Path -LiteralPath '.\RevisionTool-Setup.exe') {
        '.\RevisionTool-Setup.exe'
      } else {
        throw 'No Revision Tool installer was found.'
      };
      Start-Process -FilePath $installer -ArgumentList '/VERYSILENT /TASKS="desktopicon"' -Wait -WindowStyle Hidden

  - !writeStatus: {status: "正在优化 PowerShell"}
  - !run:
    exeDir: true
    exe: "PowerShell"
    args: '-NoP -ExecutionPolicy Bypass -File ngen.ps1'
    weight: 100

  - !writeStatus: {status: "正在配置电源计划"}
  - !run:
    path: "%ProgramFiles%\\Revision Tool"
    exe: "revitool.exe"
    args: "tweaks performance powerplan enable"
    wait: true
    runas: currentUserElevated
