---
title: 系统组件包
description: 移除系统（WinSxS）组件包
privilege: TrustedInstaller
actions:

  # NOTE: !systemPackage: method of removing system packages is now deprecated and not recommended by Revision, as it is one of the main cause of #49

  - !writeStatus: {status: "正在移除系统组件包"}
  - !run:
    path: "%ProgramFiles%\\Revision Tool"
    exe: "revitool.exe"
    args: "winpackage --install system-components-removal"
    wait: true
    runas: currentUserElevated
    weight: 100

  - !writeStatus: {status: '正在禁用 Windows Defender', option: 'disable-defender'}
  - !run:
    path: "%ProgramFiles%\\Revision Tool"
    exe: "revitool.exe"
    args: "tweaks security defender disable --force"
    wait: true
    runas: currentUserElevated
    weight: 100
    option: 'disable-defender'

  - !writeStatus: {status: '正在启用 Windows Defender', option: 'enable-defender'}
  - !run:
    path: "%ProgramFiles%\\Revision Tool"
    exe: "revitool.exe"
    args: "tweaks security defender enable"
    wait: true
    runas: currentUserElevated
    weight: 100
    option: 'enable-defender'

  - !writeStatus: {status: "正在移除 AI 组件", option: 'remove-winsxs-ai'}
  - !run:
    path: "%ProgramFiles%\\Revision Tool"
    exe: "revitool.exe"
    args: "winpackage --install ai-removal"
    wait: true
    runas: currentUserElevated
    weight: 100
    option: 'remove-winsxs-ai'

  - !writeStatus: {status: "正在移除 OneDrive WinSxS 组件", option: "remove-onedrive"}
  - !run:
    path: "%ProgramFiles%\\Revision Tool"
    exe: "revitool.exe"
    args: "winpackage --install onedrive-removal"
    wait: true
    runas: currentUserElevated
    weight: 100
    option: "remove-onedrive"

  - !writeStatus: {status: "正在移除 Xbox", option: "remove-appx-xbox"}
  - !run:
    path: "%ProgramFiles%\\Revision Tool"
    exe: "revitool.exe"
    args: "winpackage --install xbox-removal"
    wait: true
    runas: currentUserElevated
    weight: 30
    option: "remove-appx-xbox"
  #139
  - !registryValue: {path: 'HKCR\ms-gamebar', value: '', type: REG_SZ, data: 'URL:ms-gamebar', option: "remove-appx-xbox"}
  - !registryValue: {path: 'HKCR\ms-gamebar', value: 'URL Protocol', type: REG_SZ, data: '', option: "remove-appx-xbox"}
  - !registryKey: {path: 'HKCR\ms-gamebar\shell\open\command', operation: add, option: "remove-appx-xbox"}
  - !registryValue: {path: 'HKCR\ms-gamebar', value: '', type: REG_SZ, data: '%SystemRoot%\System32\systray.exe', option: "remove-appx-xbox"}
  - !registryValue: {path: 'HKCU\Software\Microsoft\GameBar', value: 'ShowStartupPanel', type: REG_DWORD, data: '0', option: "remove-appx-xbox"}
  
  - !writeStatus: {status: "正在移除核心遥测"}
  - !run:
    path: "%ProgramFiles%\\Revision Tool"
    exe: "revitool.exe"
    args: "winpackage --install telemetry-removal"
    wait: true
    runas: currentUserElevated
    weight: 100
