<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>ReviOS</Name>
    <Username>Revision</Username>
    <Title>ReviOS 配置方案</Title>
    <ShortDescription>适用于 Windows 10 和 11 的配置方案</ShortDescription>
    <Description>此配置方案可帮助你在当前系统上快速部署 ReviOS。</Description>
    <Details>在确保兼容性的同时，获得轻量、稳定且注重性能与隐私的理想系统体验。</Details>
    <Version>1.0</Version>
    <UniqueId>6a93ec26-284d-4943-9fc4-c9616def55c6</UniqueId>
    <UpgradableFrom>any</UpgradableFrom>
    <SupportedBuilds>
        <string>19044</string>
        <string>19045</string>
        <string>22631</string>
        <string>26100</string>
        <string>26200</string>
        <string>28000</string>
        <string>26300</string>
    </SupportedBuilds>
    <Requirements>
        <Requirement>DefenderToggled</Requirement>
        <Requirement>NoPendingUpdates</Requirement>
        <Requirement>NoAntivirus</Requirement>
        <!-- [离线] 不再强制要求互联网连接，配置方案不下载任何外部资源。
             仍需联网的功能（浏览器、VCRedist 安装）请自行提前准备。 -->
        <Requirement>PluggedIn</Requirement>
    </Requirements>
    <UseKernelDriver>false</UseKernelDriver>
    <ProductCode>32</ProductCode>
    <Git>https://github.com/meetrevision/playbook</Git>
    <Website>https://revi.cc</Website>
    <DonateLink>https://revi.cc/donate</DonateLink>
    <SupportsISO>true</SupportsISO>
	<ISO>
		<DisableBitLocker>true</DisableBitLocker>
		<DisableHardwareRequirements>true</DisableHardwareRequirements>
	</ISO>
	<OOBE>
		<BulletPoints>
			<BulletPoint Icon="Rocket" Title="性能提升" Description="缩短启动时间、降低延迟并优化资源占用，改善游戏和生产力体验。"/>
			<BulletPoint Icon="Privacy" Title="增强隐私" Description="禁用遥测和影响隐私的非必要服务，掌控自己的数据。"/>
			<BulletPoint Icon="Lock" Title="Revision 工具" Description="使用随配置方案提供安装包的 Revision Tool 完成系统组件移除、Defender 切换等操作。"/>
		</BulletPoints>
        <Internet>Request</Internet> 
	</OOBE>
    <Software>
        <Package Option="browser-brave" DefaultWebBrowser="true">
            <Name>brave</Name>
            <Title>Brave</Title>
            <Description>Brave 是一款由 Brave Software, Inc. 开发、基于 Chromium 且注重隐私的自由开源网页浏览器。</Description>
            <Icon>brave.png</Icon>
        </Package>
		<Package Option="browser-firefox" DefaultWebBrowser="true">
			<Name>firefox</Name>
			<Title>Firefox</Title>
			<Description>Firefox 是一款由 Mozilla 基金会开发的自由开源网页浏览器，以隐私保护和高度可定制而闻名。</Description>
			<Icon>firefox.png</Icon>
		</Package>
    </Software>
    <FeaturePages>
        <RadioImagePage CheckDefaultBrowser="true" DependsOn="software"
            DefaultOption="browser-brave" IsRequired="true"
            Description="请选择首选浏览器。部分选项仅能提供经过整理的体验。">
            <Options>
                <RadioImageOption None="true" />
                <RadioImageOption>
                    <Text>Brave</Text>
                    <Name>browser-brave</Name>
                    <FileName>brave</FileName>
                    <GradientTopColor>#392DD1</GradientTopColor>
                    <GradientBottomColor>#A91B78</GradientBottomColor>
                </RadioImageOption>
                <RadioImageOption>
                    <Text>Firefox</Text>
                    <Name>browser-firefox</Name>
                    <FileName>firefox</FileName>
                    <GradientTopColor>#FF3647</GradientTopColor>
                    <GradientBottomColor>#FFC742</GradientBottomColor>
                </RadioImageOption>
            </Options>
            <BottomLine Text="Privacy comparison" Link="https://privacytests.org/" />
        </RadioImagePage>
        <RadioPage DefaultOption="disable-defender" Description="禁用 Windows Defender 可提升系统性能，但会牺牲安全性。">
            <Options>
                <RadioOption>
                    <Text>禁用 Windows Defender（默认）</Text>
                    <Name>disable-defender</Name>
                </RadioOption>
                <RadioOption>
                    <Text>启用 Windows Defender</Text>
                    <Name>enable-defender</Name>
                </RadioOption>
            </Options>
        </RadioPage>
        <RadioPage DefaultOption="disable-hibernate" Description="禁用后可释放磁盘空间，并避免双系统或系统升级时出现不稳定。">
            <TopLine Text="This includes Fast Startup"/>
            <Options>
                <RadioOption>
                    <Text>禁用休眠（默认）</Text>
                    <Name>disable-hibernate</Name>
                </RadioOption>
                <RadioOption>
                    <Text>启用休眠</Text>
                    <Name>enable-hibernate</Name>
                </RadioOption>
            </Options>
            <BottomLine Text="⚠️ Disabling may overheat laptops in sleep mode"/>
        </RadioPage>
        <CheckboxPage IsRequired="true" Description="请选择要包含或排除的组件。">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>移除 Microsoft Edge</Text>
                    <Name>remove-edge</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>移除 OneDrive</Text>
                    <Name>remove-onedrive</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>移除 AI 组件（Recall 和 Copilot）</Text>
                    <Name>remove-winsxs-ai</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>移除 Microsoft Teams</Text>
                    <Name>remove-teams</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage IsRequired="true" Description="请选择要移除的 UWP 应用包。">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>移除 Microsoft 照片</Text>
                    <Name>remove-appx-photos</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>移除开发人员主页</Text>
                    <Name>remove-appx-devhome</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>移除 Xbox 应用</Text>
                    <Name>remove-appx-xbox</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>移除“手机连接”</Text>
                    <Name>remove-appx-yourphone</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage IsRequired="true" Description="常规配置选项">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>应用 Revision 壁纸</Text>
                    <Name>configure-wallpaper</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>启用深色模式</Text>
                    <Name>configure-darkmode</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>启用传统右键菜单</Text>
                    <Name>configure-lcm</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>禁用透明效果</Text>
                    <Name>configure-te</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage IsRequired="true" Description="常规配置选项（第 2 页）">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>移除开始菜单中的固定项目</Text>
                    <Name>remove-pinned-items-startmenu</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>禁用自动维护</Text>
                    <Name>disable-automatic-maintenance</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
    </FeaturePages>
</Playbook>
